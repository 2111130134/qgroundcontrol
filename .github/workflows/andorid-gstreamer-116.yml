name: Android APK - GStreamer 1.16.3

on:
  workflow_dispatch:
    inputs:
      gstreamer_version:
        description: "GStreamer version"
        required: true
        default: "1.16.3"
        type: string
  # push:
  #   branches:
  #     - Stable_V5.0
  #     - "Stable*"
  #     - master
  #     - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        BuildType: [Release]

    defaults:
      run:
        shell: bash

    env:
      QT_VERSION: 6.8.3
      GSTREAMER_VERSION: ${{ inputs.gstreamer_version || '1.16.3' }}
      QT_ANDROID_ABIS: "armeabi-v7a;arm64-v8a"

      QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/qgc-release.keystore
      QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          fetch-tags: false

      - name: Fetch tags for version
        run: git fetch --all --tags -f --depth 1

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          large-packages: false

      - name: Install Qt for Android
        uses: ./.github/actions/qt-android
        with:
          host: linux
          arch: linux_gcc_64
          version: ${{ env.QT_VERSION }}
          abis: ${{ env.QT_ANDROID_ABIS }}
          cpm-modules: ${{ runner.temp }}/shadow_build_dir/cpm_modules

      - name: Restore Android signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ env.QT_ANDROID_KEYSTORE_PATH }}"
          ls -lh "${{ env.QT_ANDROID_KEYSTORE_PATH }}"

      - name: Patch GStreamer archive suffix for 1.16.3
        if: env.GSTREAMER_VERSION == '1.16.3'
        run: |
            python3 <<'PY'
            from pathlib import Path

            p = Path("cmake/find-modules/FindGStreamer.cmake")
            s = p.read_text()

            s = s.replace(
                "gstreamer-1.0-android-universal-${GStreamer_FIND_VERSION}.tar.xz",
                "gstreamer-1.0-android-universal-${GStreamer_FIND_VERSION}.tar.bz2"
            )

            p.write_text(s)
            print("Patched GStreamer Android package suffix: .tar.xz -> .tar.bz2")
            PY

      - name: Configure
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: |
          ${{ env.QT_ROOT_DIR }}/bin/qt-cmake \
            -S ${{ github.workspace }} \
            -B . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.BuildType }} \
            -DCMAKE_WARN_DEPRECATED=FALSE \
            -DQT_ANDROID_ABIS="${{ env.QT_ANDROID_ABIS }}" \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DQT_HOST_PATH="${{ env.QT_ROOT_DIR }}/../gcc_64" \
            -DQT_ANDROID_SIGN_APK=${{ env.ANDROID_KEYSTORE_BASE64 != '' && 'ON' || 'OFF' }} \
            -DQGC_STABLE_BUILD=ON \
            -DGStreamer_FIND_VERSION="${{ env.GSTREAMER_VERSION }}" \
            -DQGC_VERSION_BASE="Stable_V5.0" \
            -DQT_ANDROID_MULTI_ABI_FORWARD_VARS="GStreamer_FIND_VERSION;QGC_VERSION_BASE"

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: |
          cmake --build . --target all --config ${{ matrix.BuildType }}

          rm -rf artifacts
          mkdir -p artifacts

          APK_PATH="$(find . -name "QGroundControl.apk" | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "QGroundControl.apk not found"
            find . -name "*.apk" -print
            exit 1
          fi

          echo "Found APK: $APK_PATH"

          cp "$APK_PATH" "artifacts/QGC-V5.0-gst-${GSTREAMER_VERSION}.apk"

          ls -lh artifacts

      - name: Verify APK signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          echo "Using apksigner: $APKSIGNER"

          APK="artifacts/QGC-V5.0-gst-${GSTREAMER_VERSION}.apk"

          echo "Verifying $APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-Android-GStreamer-${{ env.GSTREAMER_VERSION }}
          path: ${{ runner.temp }}/shadow_build_dir/artifacts/QGC-V5.0-gst-${{ env.GSTREAMER_VERSION }}.apk